services:
  postgres:
    image: postgres:15-alpine
    container_name: smarttask-db
    environment:
      POSTGRES_USER: smarttask_user
      POSTGRES_PASSWORD: smarttask_pass
      POSTGRES_DB: smarttask_db
    ports:
      - "5432:5432"
    restart: always

  backend:
    image: sakhasow/smarttask-backend:1.0
    container_name: smarttask-backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - POSTGRES_USER=smarttask_user
      - POSTGRES_PASSWORD=smarttask_pass
      - POSTGRES_DB=smarttask_db
    depends_on:
      - postgres
    restart: always

  frontend:
    image: sakhasow/smarttask-frontend:1.0
    container_name: smarttask-frontend
    ports:
      - "8080:80"
    environment:
      - REACT_APP_API_URL=http://192.168.186.204:5000
      - VITE_API_URL=http://192.168.186.204:5000
    depends_on:
      - backend
    restart: always
